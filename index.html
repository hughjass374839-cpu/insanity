<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For Aanchal</title>

<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet">

<style>
body{
  margin:0;
  overflow:hidden;
  background:#4b0273;
  color:#e6ccff;
  font-family:'Great Vibes', cursive;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:flex-start;
  height:100vh;
  text-align:center;
}

/* Top container */
.top{
  margin-top:40px;
  z-index:3;
}

h1{
  font-size:80px;
  margin:0;
  text-shadow:
    0 0 6px rgba(0,0,0,0.9),
    0 0 15px rgba(226, 8, 226, 0.6);
}

button{
  margin-top:20px;
  padding:14px 34px;
  border-radius:30px;
  border:none;
  background:rgba(255,255,255,0.15);
  color:#e6ccff;
  font-family:'Great Vibes', cursive;
  font-size:32px;
  cursor:pointer;
  text-shadow: 0 0 8px rgba(0,0,0,0.8);
}

/* Message */
#message{
  position:absolute;
  bottom:6%;
  width:100%;
  font-size:38px;
  opacity:0;
  transition:opacity 2s ease;
  z-index:3;
  line-height:1.4;
  text-shadow:
    0 0 6px rgba(0,0,0,0.9),
    0 0 12px rgba(0,0,0,0.8);
}

canvas{
  position:absolute;
  top:0;
  left:0;
  z-index:1;
}

/* Floating Emojis */
.floating{
  position:absolute;
  font-size:28px;
  opacity:0.75;
  z-index:2;
  animation: floatUp linear infinite;
  pointer-events:none;
}

@keyframes floatUp{
  from { transform: translateY(100vh); }
  to { transform: translateY(-10vh); }
}
</style>
</head>
<body>

<div class="top">
  <h1>Hey Aanchal</h1>
  <button id="btn">If ur pretty and you know it click :p</button>
</div>

<canvas id="c"></canvas>

<div id="message">
too far away to handpick flowers and too broke to buy you some ;-;…<br><br>
But here are some virtual flowers.<br><br> as a reminder that even if no one does, u will always have me ;] <br><br>
Happy Valentine’s Day.<br><br>
— Nityodit
</div>

<script>
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");
const btn = document.getElementById("btn");
const message = document.getElementById("message");

function resize(){
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
resize();
window.addEventListener("resize", resize);

function drawPetal(x,y,angle,scale){
  ctx.save();
  ctx.translate(x,y);
  ctx.rotate(angle);
  ctx.scale(scale,scale);

  let grad = ctx.createRadialGradient(0,-60,10,0,-60,110);
  grad.addColorStop(0,"#ff5ca8");
  grad.addColorStop(0.5,"#ffe3f2");
  grad.addColorStop(1,"#ffffff");

  ctx.fillStyle = grad;
  ctx.shadowColor = "rgba(255,120,180,0.5)";
  ctx.shadowBlur = 30;

  ctx.beginPath();
  ctx.moveTo(0,0);
  ctx.bezierCurveTo(40,-100,130,-100,0,-200);
  ctx.bezierCurveTo(-130,-100,-40,-100,0,0);
  ctx.fill();

  ctx.restore();
}

function drawLily(cx,cy,scale){
  for(let i=0;i<6;i++){
    drawPetal(cx,cy,i*Math.PI/3,scale);
  }

  ctx.beginPath();
  let core = ctx.createRadialGradient(cx,cy,5,cx,cy,40);
  core.addColorStop(0,"#ffd700");
  core.addColorStop(1,"#ff8c00");
  ctx.fillStyle = core;
  ctx.arc(cx,cy,30*scale,0,Math.PI*2);
  ctx.fill();
}

function drawBouquet(){
  ctx.fillStyle="#1a0028";
  ctx.fillRect(0,0,canvas.width,canvas.height);

  const cx = canvas.width/2;
  const cy = canvas.height/2 + 180;

  ctx.fillStyle="#1c5a3d";
  ctx.beginPath();
  ctx.ellipse(cx,cy+80,320,380,0,0,Math.PI*2);
  ctx.fill();

  drawLily(cx,cy-260,1.3);
  drawLily(cx-220,cy-170,1);
  drawLily(cx+220,cy-170,1);
  drawLily(cx-110,cy-120,0.9);
  drawLily(cx+110,cy-120,0.9);
  drawLily(cx-180,cy-60,0.8);
  drawLily(cx+180,cy-60,0.8);
}

function createFloating(){
  const emojis = ["✨","🌹","💐"];
  for(let i=0;i<25;i++){
    let span = document.createElement("div");
    span.className="floating";
    span.innerText = emojis[Math.floor(Math.random()*emojis.length)];
    span.style.left = Math.random()*100+"vw";
    span.style.animationDuration = (7+Math.random()*5)+"s";
    span.style.fontSize = (22+Math.random()*25)+"px";
    document.body.appendChild(span);
  }
}

btn.addEventListener("click",()=>{
  btn.style.display="none";
  drawBouquet();
  createFloating();
  message.style.opacity=1;
});
</script>

</body>
</html>
